<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Clientes</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--txt:#1d2033;--muted:#6b7089;--line:#e4e6f1;--accent:#5b5bd6;--accent2:#7c5cff;--danger:#d64545;--shadow:0 2px 10px rgba(30,32,60,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#12131c;--card:#1b1d2b;--txt:#eceef9;--muted:#9a9fba;--line:#2a2d42;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
header{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;padding:28px 20px 70px}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:26px}
header p{margin:4px 0 0;opacity:.85}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px}
.primary{background:var(--accent);color:#fff;font-weight:600}
header .primary{background:#fff;color:var(--accent)}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.ghost:hover{color:var(--txt)}
.danger{color:var(--danger)}
main{margin-top:-42px;padding:0 20px 40px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;display:flex;gap:12px;align-items:center;margin-bottom:18px}
.bar input{flex:1;border:0;outline:0;background:transparent;color:var(--txt);font:inherit;padding:6px 4px}
.badge{background:var(--bg);color:var(--muted);border-radius:20px;padding:3px 12px;font-size:13px;white-space:nowrap}
#lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:hsl(var(--h),62%,52%)}
.info{min-width:0}
.info h3{margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{margin:0;color:var(--muted);font-size:14px}
.notas{margin:0;font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;white-space:pre-wrap}
.acoes{display:flex;gap:8px;justify-content:flex-end}
.acoes button{padding:6px 12px;font-size:13px}
#vazio{text-align:center;color:var(--muted);padding:50px 10px}
dialog{border:0;border-radius:16px;padding:0;width:min(460px,92vw);background:var(--card);color:var(--txt);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,10,25,.55)}
form{padding:22px;display:flex;flex-direction:column;gap:14px}
form h2{margin:0;font-size:20px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
input,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}
input:focus,textarea:focus{border-color:var(--accent)}
.rodape{display:flex;justify-content:flex-end;gap:10px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:#24263a;color:#fff;padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.erro{background:var(--danger)}
</style>
</head>
<body>
<header><div class="wrap top">
  <div><h1>Gestão de Clientes</h1><p>Os teus clientes num só lugar</p></div>
  <button class="primary" id="novo">+ Novo cliente</button>
</div></header>

<main><div class="wrap">
  <div class="bar">
    <input id="q" type="search" placeholder="Pesquisar por nome, contacto ou notas…">
    <span class="badge" id="total">0 clientes</span>
  </div>
  <div id="lista"></div>
  <div id="vazio" hidden>Ainda não há clientes para mostrar.<br>Clica em “Novo cliente” para começar.</div>
</div></main>

<dialog id="dlg">
  <form id="form">
    <h2 id="titulo">Novo cliente</h2>
    <label>Nome<input id="nome" required maxlength="200"></label>
    <label>Contacto<input id="contacto" maxlength="100" placeholder="Telefone ou email"></label>
    <label>Notas<textarea id="notas" rows="4"></textarea></label>
    <div class="rodape">
      <button type="button" class="ghost" id="cancelar">Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let dados = [], editId = null, tempo;

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ini = n => n.trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const hue = n => [...n].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;

function aviso(msg, erro) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (erro ? ' erro' : '');
  clearTimeout(tempo);
  tempo = setTimeout(() => t.className = '', 2800);
}

async function api(url, opts) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) {
    let m = 'Ocorreu um erro inesperado.';
    try { m = (await r.json()).erro || m; } catch {}
    throw new Error(m);
  }
  return r.status === 204 ? null : r.json();
}

async function carregar() {
  const q = $('#q').value.trim();
  try {
    dados = await api('/api/clientes' + (q ? '?q=' + encodeURIComponent(q) : ''));
  } catch (e) { return aviso(e.message, true); }
  $('#total').textContent = dados.length === 1 ? '1 cliente' : dados.length + ' clientes';
  $('#vazio').hidden = dados.length > 0;
  $('#lista').innerHTML = dados.map(c => `
    <article class="card">
      <div class="head">
        <div class="avatar" style="--h:${hue(c.nome)}">${esc(ini(c.nome))}</div>
        <div class="info"><h3>${esc(c.nome)}</h3><p class="muted">${esc(c.contacto) || 'Sem contacto'}</p></div>
      </div>
      ${c.notas ? `<p class="notas">${esc(c.notas)}</p>` : ''}
      <div class="acoes">
        <button class="ghost" data-ed="${c.id}">Editar</button>
        <button class="ghost danger" data-del="${c.id}">Apagar</button>
      </div>
    </article>`).join('');
}

function abrir(c) {
  editId = c ? c.id : null;
  $('#titulo').textContent = c ? 'Editar cliente' : 'Novo cliente';
  $('#nome').value = c ? c.nome : '';
  $('#contacto').value = c ? c.contacto : '';
  $('#notas').value = c ? c.notas : '';
  $('#dlg').showModal();
  $('#nome').focus();
}

$('#novo').onclick = () => abrir(null);
$('#cancelar').onclick = () => $('#dlg').close();
$('#q').oninput = () => { clearTimeout(window._d); window._d = setTimeout(carregar, 250); };

$('#lista').onclick = async e => {
  const ed = e.target.closest('[data-ed]'), del = e.target.closest('[data-del]');
  if (ed) abrir(dados.find(c => c.id == ed.dataset.ed));
  if (del && confirm('Apagar este cliente?')) {
    try { await api('/api/clientes/' + del.dataset.del, { method: 'DELETE' }); aviso('Cliente apagado'); carregar(); }
    catch (err) { aviso(err.message, true); }
  }
};

$('#form').onsubmit = async e => {
  e.preventDefault();
  const novo = editId === null;
  const body = JSON.stringify({ nome: $('#nome').value, contacto: $('#contacto').value, notas: $('#notas').value });
  try {
    await api(novo ? '/api/clientes' : '/api/clientes/' + editId, { method: novo ? 'POST' : 'PUT', body });
    $('#dlg').close();
    aviso(novo ? 'Cliente adicionado' : 'Cliente atualizado');
    carregar();
  } catch (err) { aviso(err.message, true); }
};

carregar();
</script>
</body>
</html>
